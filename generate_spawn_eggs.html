<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spawn Egg Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #222;
            color: white;
            padding: 40px;
        }
        canvas {
            image-rendering: pixelated;
            width: 256px;
            height: 256px;
            margin: 20px;
            border: 2px solid #555;
        }
        input {
            margin: 10px;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Spawn Egg Generator</h1>
    <label>Base Color:</label>
    <input type="color" id="baseColor" value="#FFFFFF">
    <label>Overlay Color:</label>
    <input type="color" id="colorPicker" value="#00AA00">
    <br>
    <canvas id="preview"></canvas>
    <br>
    <button id="download">Download Spawn Egg</button>
    <script>
        const canvas = document.getElementById("preview");
        const ctx = canvas.getContext("2d");
        const colorPicker = document.getElementById("colorPicker");
        const baseColorPicker = document.getElementById("baseColor");
        const downloadButton = document.getElementById("download");
        const baseImage = new Image();
        const overlayImage = new Image();
        baseImage.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAABGdBTUEAALGPC/xhBQAAAM1JREFUOMullEEKgzAURL1eT5GFuMsdvEQv0Lu4iLmCiEYI6kbFhdspE0hJpVWbBgZJ5L38fInJ7XFPfKJGNHhFkOc5pJSIltd1Da01KIqWjOPoJNGCdV3RdZ0TnB6HpVZVhRCepgnGGJRl6XIooYC7zfOMbdvcs+/7F3AoIMymhcAwDG8VXarCWutesvSmaZyA8TCTZdl3Qdu2WJYF7D7newHXhBA4bCJ3Dtc9eDooKIoCe+CywH9rJjyzUgppmuKnexR2+hP810UMfwFPoynoo/Y7q0gAAAAASUVORK5CYII=";
        overlayImage.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAABWUlEQVR42q2UMUvDUBSF729y0NHJIag4OPgbXJIp1EqbZMqYqWJBRUqhjSIGp1DEqEHEEBIQba1tjTWVloL/4frug0ipNK3FB4e35Hznnct7AaFUgERzrbmNswDWxG1Y3tr8O1TTNCQVm0+g3N9wkKIoOLO5XC5jtVrFIAjwPI44xDAMzGaz0yGqqmKlUkHbttHzPLwd9qHUeQHLsnBqHTpqofEIYRii7/voMrPd78FxuwG7dw5XKoQAlFYb9ODhawiXzHza7QBV0nUdUwFk3m8+w0m3DZQeRRGefbxBkZ3IcZwfwERIPp/nwzOjFsRxjDWWfvBa55VIiZm0tLH6G5DL5XjKUasOV4NPuIjfwXVdHAfQkBeElck19tjHhwximiaOdqedJEkSpg5RvrZ5UmKme5EAZFlGURTT7wINiDTaeYdpcV2AcXPqOyIIJWYyGSTzvz7E0V/AN87bB/olu+jHAAAAAElFTkSuQmCC";
        let loaded = 0;
        function imageLoaded() {
            loaded++;
            if (loaded === 2) {
                canvas.width = baseImage.width;
                canvas.height = baseImage.height;
                generate();
            }
        }
        baseImage.onload = imageLoaded;
        overlayImage.onload = imageLoaded;
        colorPicker.addEventListener("input", generate);
        baseColorPicker.addEventListener("input", generate);
        function generate() {
            if (loaded < 2) return;
            canvas.width = baseImage.width;
            canvas.height = baseImage.height;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const baseCanvas = document.createElement("canvas");
            baseCanvas.width = baseImage.width;
            baseCanvas.height = baseImage.height;
            const baseCtx = baseCanvas.getContext("2d");
            baseCtx.drawImage(baseImage, 0, 0);
            const baseData = baseCtx.getImageData(
                0,
                0,
                baseCanvas.width,
                baseCanvas.height
            );
            const basePixels = baseData.data;
            const baseHex = baseColorPicker.value;
            const baseR = parseInt(baseHex.substring(1, 3), 16);
            const baseG = parseInt(baseHex.substring(3, 5), 16);
            const baseB = parseInt(baseHex.substring(5, 7), 16);
            for (let i = 0; i < basePixels.length; i += 4) {
                const alpha = basePixels[i + 3];
                if (alpha === 0) continue;
                const brightness =
                    (basePixels[i] +
                        basePixels[i + 1] +
                        basePixels[i + 2]) / 765;
                basePixels[i] = baseR * brightness;
                basePixels[i + 1] = baseG * brightness;
                basePixels[i + 2] = baseB * brightness;
            }
            baseCtx.putImageData(baseData, 0, 0);
            ctx.drawImage(baseCanvas, 0, 0);
            const tempCanvas = document.createElement("canvas");
            tempCanvas.width = overlayImage.width;
            tempCanvas.height = overlayImage.height;
            const tempCtx = tempCanvas.getContext("2d");
            tempCtx.drawImage(overlayImage, 0, 0);
            const imageData = tempCtx.getImageData(
                0,
                0,
                tempCanvas.width,
                tempCanvas.height
            );
            const pixels = imageData.data;
            const hex = colorPicker.value;
            const r = parseInt(hex.substring(1, 3), 16);
            const g = parseInt(hex.substring(3, 5), 16);
            const b = parseInt(hex.substring(5, 7), 16);
            for (let i = 0; i < pixels.length; i += 4) {
                const alpha = pixels[i + 3];
                if (alpha === 0) continue;
                const brightness =
                    (pixels[i] +
                        pixels[i + 1] +
                        pixels[i + 2]) / 765;
                pixels[i] = r * brightness;
                pixels[i + 1] = g * brightness;
                pixels[i + 2] = b * brightness;
            }
            tempCtx.putImageData(imageData, 0, 0);
            ctx.drawImage(tempCanvas, 0, 0);
        }
        downloadButton.addEventListener("click", () => {
            const link = document.createElement("a");
            link.download = "spawn_egg.png";
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    </script>
</body>
</html>
